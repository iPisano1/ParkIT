<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Parking System for easy parking spot booking.">
  <title>Admin Panel</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header>
    <nav>
        <h1>Park-IT Admin Panel</h1>
        <button id="logoutBtn" onclick="logout()">Log Out</button>
    </nav>
  </header>
  <main>

    <section class="parkingarea">
      <h2>Parking Availability</h2>
      <div class="parking-wrapper">
        <div class="center-block">
          <script>
            const block = (prefix)=>{
              document.write('<div>');
              let count = 1;
              for(let r=0;r<8;r++){
                document.write('<div class="row">');
                for(let c=0;c<2;c++){
                  const label = prefix + count;
                  document.write('<div class="slot available" data-spot="'+label+'"><span style="position:absolute;bottom:4px;right:4px;font-size:10px;color:white;user-select: none; ">'+label+'</span></div>');
                  count++;
                }
                document.write('</div>');
              }
              document.write('</div>');
            };
            block('A'); block('B'); block('C'); block('D'); block('E');
          </script>
        </div>
      </div>
    </section>

    <section class="stats-section">
      <div class="stats-card">
        <h2>Parking Status</h2>

        <div class="stats-grid">
          <div class="stat-item">
            <h3>Total Spots</h3>
            <p id="totalspots">0</p>
          </div>

          <div class="stat-item available">
            <h3>Available</h3>
            <p id="availableCount">0</p>
          </div>

          <div class="stat-item occupied">
            <h3>Occupied</h3>
            <p id="occupiedCount">0</p>
          </div>
        </div>
      </div>
    </section>

    <section class="maniBtns">
      <div class="btn-group">
        <div class="btn-row">
          <button class="btn-item" onclick="setAllAvailable()">Set All Available</button>
          <button class="btn-item" onclick="refreshStats()">Refresh Stats</button>
          <button class="btn-item" onclick="setAllOccupied()">Set All Occupied</button>
        </div>
      </div>
    </section>

  <footer>
    <p>© 2025 Park-IT. All rights reserved.</p>
  </footer>

  <script src="js/admin.js"></script>
</body>
</html>
