<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Parking System for easy parking spot booking.">
  <title>ParkIT</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header>
    <nav>
        <h1>Park-IT</h1>
        <button id="adminBtn" onclick="adminLog()">Admin</button>
    </nav>
  </header>
  <main>
    <section id="home">
      <h1>Welcome to the Park-IT</h1>
      <p>Find and book parking spots easily!</p>
    </section>

    <section>
      <h2>Parking Availability</h2>
      <div class="parking-wrapper">
        <div class="center-block">
          <script>
            const block = (prefix)=>{
              document.write('<div>');
              let count = 1;
              for(let r=0;r<8;r++){
                document.write('<div class="row">');
                for(let c=0;c<2;c++){
                  const label = prefix + count;
                  document.write('<div class="slot available" data-spot="'+label+'"><span style="position:absolute;bottom:4px;right:4px;font-size:10px;color:white;user-select: none; ">'+label+'</span></div>');
                  count++;
                }
                document.write('</div>');
              }
              document.write('</div>');
            };
            block('A'); block('B'); block('C'); block('D'); block('E');
          </script>
        </div>
      </div>
    </section>
    
    <section id="booking">
      <h2>Book a Parking Spot</h2>
      <form id="booking-form">

        <label for="spot">Select a spot:</label>
        <select id="spot" name="spot" multiple size="4" required> 
          <option value="" disabled>Selected spot(s)</option>
        </select>

        <label for="time">Booking Time:</label>
        <input type="datetime-local" id="time" name="time" required>

        <label for="name">Reservist Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <button type="submit">Book Now</button>
      </form>
    </section>


    <section id="contact">
      <h2>Contact Us</h2>
      <p>If you have any questions, feel free to contact us at parkit@gmail.com.</p>
    </section>
  </main>

  <footer>
    <p>© 2025 Park-IT. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
